<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0d12">
<title>UUID4 QR 생성기</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --fg: #14161a;
    --muted: #6b7280;
    --line: #e3e5ea;
    --accent: #2f5bff;
    --accent-fg: #ffffff;
    --qr-dark: #14161a;
    --qr-light: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --card: #151922;
      --fg: #eef1f6;
      --muted: #97a0b0;
      --line: #262c38;
      --accent: #6b8cff;
      --accent-fg: #0b0d12;
      --qr-dark: #0b0d12;
      --qr-light: #ffffff;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
                 "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  main {
    width: 100%;
    max-width: 420px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header { text-align: center; padding: 4px 0 2px; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; font-size: .8rem; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .qr-frame {
    background: #fff;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    max-width: 320px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .uuid {
    margin-top: 14px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(.8rem, 3.6vw, .95rem);
    line-height: 1.5;
    text-align: center;
    word-break: break-all;
    user-select: all;
    -webkit-user-select: all;
    color: var(--fg);
  }

  .meta {
    margin-top: 6px;
    text-align: center;
    font-size: .72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions .wide { grid-column: 1 / -1; }

  button {
    appearance: none;
    font: inherit;
    font-weight: 600;
    font-size: .9rem;
    min-height: 50px;
    padding: 0 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .08s ease, opacity .15s ease, background .15s ease;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: transparent;
  }
  button:active { transform: scale(.98); }
  @media (hover: hover) {
    button:hover { opacity: .9; }
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: .85rem;
  }
  .row + .row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .row label { color: var(--muted); }
  select {
    appearance: none;
    font: inherit;
    font-size: .85rem;
    padding: 8px 30px 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b7280' stroke-width='1.6' stroke-linecap='round'/></svg>") no-repeat right 10px center;
    color: var(--fg);
    min-height: 40px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 16px);
    background: var(--fg);
    color: var(--bg);
    font-size: .82rem;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { text-align: center; font-size: .7rem; color: var(--muted); padding-bottom: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>UUID4 QR 생성기</h1>
    <p>랜덤 UUID v4를 QR 코드로 만듭니다</p>
  </header>

  <section class="card">
    <div class="qr-frame">
      <canvas id="qr" role="img" aria-label="UUID QR 코드"></canvas>
    </div>
    <p class="uuid" id="uuidText">&nbsp;</p>
    <p class="meta" id="meta">&nbsp;</p>
  </section>

  <div class="actions">
    <button class="primary wide" id="regen" type="button">새 UUID 생성</button>
    <button id="copy" type="button">UUID 복사</button>
    <button id="save" type="button">PNG 저장</button>
  </div>

  <section class="card">
    <div class="row">
      <label for="ecl">오류 정정 레벨</label>
      <select id="ecl">
        <option value="L">L (7%)</option>
        <option value="M" selected>M (15%)</option>
        <option value="Q">Q (25%)</option>
        <option value="H">H (30%)</option>
      </select>
    </div>
    <div class="row">
      <label for="upper">대문자로 표기</label>
      <input type="checkbox" id="upper" style="width:22px;height:22px;accent-color:var(--accent);">
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================================
   QR Code encoder (byte mode, versions 1-10) — 외부 의존성 없는 자체 구현
   ISO/IEC 18004 기준: RS(255) over GF(2^8), 마스크 8종 + 페널티 평가
   ========================================================================= */
const QR = (() => {
  const ECC_ORDER = { L: 0, M: 1, Q: 2, H: 3 };
  const ECC_FORMAT_BITS = [1, 0, 3, 2];           // L, M, Q, H
  const MAX_VERSION = 10;

  // 블록당 오류정정 코드워드 수 (버전 1..10)
  const ECC_CODEWORDS_PER_BLOCK = [
    [7, 10, 15, 20, 26, 18, 20, 24, 30, 18],      // L
    [10, 16, 26, 18, 24, 16, 18, 22, 22, 26],     // M
    [13, 22, 18, 26, 18, 24, 18, 22, 20, 24],     // Q
    [17, 28, 22, 16, 22, 28, 26, 26, 24, 28],     // H
  ];
  // 오류정정 블록 수 (버전 1..10)
  const NUM_ECC_BLOCKS = [
    [1, 1, 1, 1, 1, 2, 2, 2, 2, 4],               // L
    [1, 1, 1, 2, 2, 4, 4, 4, 5, 5],               // M
    [1, 1, 2, 2, 4, 4, 6, 6, 8, 8],               // Q
    [1, 1, 2, 4, 4, 4, 5, 6, 8, 8],               // H
  ];

  const getBit = (x, i) => ((x >>> i) & 1) !== 0;

  function rawDataModules(ver) {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }

  const totalCodewords = (ver) => Math.floor(rawDataModules(ver) / 8);

  function dataCodewords(ver, ecl) {
    return totalCodewords(ver)
      - ECC_CODEWORDS_PER_BLOCK[ecl][ver - 1] * NUM_ECC_BLOCKS[ecl][ver - 1];
  }

  function alignmentPositions(ver) {
    if (ver === 1) return [];
    const numAlign = Math.floor(ver / 7) + 2;
    const step = Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
    const size = ver * 4 + 17;
    const result = [6];
    for (let pos = size - 7; result.length < numAlign; pos -= step) result.splice(1, 0, pos);
    return result;
  }

  /* ---- GF(2^8) 연산 (원시 다항식 0x11D) ---- */
  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xFF;
  }

  function rsDivisor(degree) {
    const result = new Uint8Array(degree);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < degree; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < degree) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return result;
  }

  function rsRemainder(data, divisor) {
    const result = new Uint8Array(divisor.length);
    for (const b of data) {
      const factor = b ^ result[0];
      result.copyWithin(0, 1);
      result[result.length - 1] = 0;
      for (let i = 0; i < result.length; i++) result[i] ^= gfMul(divisor[i], factor);
    }
    return result;
  }

  /* ---- 비트스트림 → 코드워드 ---- */
  function buildCodewords(bytes, ver, ecl) {
    const capacityBits = dataCodewords(ver, ecl) * 8;
    const bits = [];
    const push = (val, len) => {
      for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
    };

    push(0b0100, 4);                        // 바이트 모드
    push(bytes.length, ver < 10 ? 8 : 16);  // 문자 수
    for (const b of bytes) push(b, 8);

    push(0, Math.min(4, capacityBits - bits.length));   // 종단자
    push(0, (8 - bits.length % 8) % 8);                 // 바이트 정렬

    const data = new Uint8Array(capacityBits / 8);
    for (let i = 0; i < bits.length; i++) data[i >>> 3] |= bits[i] << (7 - (i & 7));
    for (let i = bits.length / 8, pad = 0xEC; i < data.length; i++, pad ^= 0xEC ^ 0x11) {
      data[i] = pad;                                    // 패딩 0xEC / 0x11 반복
    }
    return data;
  }

  // 블록 분할 → RS 부호화 → 인터리빙
  function addEccAndInterleave(data, ver, ecl) {
    const numBlocks = NUM_ECC_BLOCKS[ecl][ver - 1];
    const eccLen = ECC_CODEWORDS_PER_BLOCK[ecl][ver - 1];
    const rawTotal = totalCodewords(ver);
    const numShort = numBlocks - rawTotal % numBlocks;
    const shortLen = Math.floor(rawTotal / numBlocks) - eccLen;

    const divisor = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < numBlocks; i++) {
      const len = shortLen + (i < numShort ? 0 : 1);
      const dat = data.subarray(k, k + len);
      k += len;
      blocks.push({ dat, ecc: rsRemainder(dat, divisor) });
    }

    const result = new Uint8Array(rawTotal);
    let n = 0;
    for (let i = 0; i < shortLen + 1; i++) {
      for (const blk of blocks) if (i < blk.dat.length) result[n++] = blk.dat[i];
    }
    for (let i = 0; i < eccLen; i++) {
      for (const blk of blocks) result[n++] = blk.ecc[i];
    }
    return result;
  }

  /* ---- 매트릭스 구성 ---- */
  function createMatrix(text, eclName) {
    const ecl = ECC_ORDER[eclName in ECC_ORDER ? eclName : "M"];
    const bytes = new TextEncoder().encode(text);

    let ver = 1;
    for (; ver <= MAX_VERSION; ver++) {
      const capacity = dataCodewords(ver, ecl) * 8;
      if (4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= capacity) break;
    }
    if (ver > MAX_VERSION) throw new Error("데이터가 너무 깁니다");

    const size = ver * 4 + 17;
    const modules = Array.from({ length: size }, () => new Uint8Array(size));
    const isFn = Array.from({ length: size }, () => new Uint8Array(size));

    const setFn = (x, y, dark) => {
      if (x < 0 || y < 0 || x >= size || y >= size) return;
      modules[y][x] = dark ? 1 : 0;
      isFn[y][x] = 1;
    };

    const drawFinder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const dist = Math.max(Math.abs(dx), Math.abs(dy));
          setFn(cx + dx, cy + dy, dist !== 2 && dist !== 4);
        }
      }
    };

    const drawAlign = (cx, cy) => {
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          setFn(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
    };

    function drawFormatBits(mask) {
      const dataBits = (ECC_FORMAT_BITS[ecl] << 3) | mask;
      let rem = dataBits;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bits = ((dataBits << 10) | rem) ^ 0x5412;

      for (let i = 0; i <= 5; i++) setFn(8, i, getBit(bits, i));
      setFn(8, 7, getBit(bits, 6));
      setFn(8, 8, getBit(bits, 7));
      setFn(7, 8, getBit(bits, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(bits, i));

      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(bits, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(bits, i));
      setFn(8, size - 8, true);   // 항상 어두운 모듈
    }

    function drawVersionBits() {
      if (ver < 7) return;
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const bits = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const bit = getBit(bits, i);
        const a = size - 11 + i % 3, b = Math.floor(i / 3);
        setFn(a, b, bit);
        setFn(b, a, bit);
      }
    }

    // 기능 패턴
    for (let i = 0; i < size; i++) {
      setFn(6, i, i % 2 === 0);
      setFn(i, 6, i % 2 === 0);
    }
    drawFinder(3, 3);
    drawFinder(size - 4, 3);
    drawFinder(3, size - 4);
    const align = alignmentPositions(ver);
    for (let i = 0; i < align.length; i++) {
      for (let j = 0; j < align.length; j++) {
        const corner = (i === 0 && j === 0)
          || (i === 0 && j === align.length - 1)
          || (i === align.length - 1 && j === 0);
        if (!corner) drawAlign(align[i], align[j]);
      }
    }
    drawFormatBits(0);
    drawVersionBits();

    // 데이터 배치 (우하단에서 지그재그)
    const codewords = addEccAndInterleave(buildCodewords(bytes, ver, ecl), ver, ecl);
    let bitIdx = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!isFn[y][x] && bitIdx < codewords.length * 8) {
            modules[y][x] = getBit(codewords[bitIdx >>> 3], 7 - (bitIdx & 7)) ? 1 : 0;
            bitIdx++;
          }
        }
      }
    }

    /* ---- 마스킹 & 페널티 ---- */
    const maskFns = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x, y) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
      (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
    ];

    const applyMask = (mask) => {
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (!isFn[y][x] && maskFns[mask](x, y)) modules[y][x] ^= 1;
        }
      }
    };

    const addHistory = (runLen, hist) => {
      if (hist[0] === 0) runLen += size;     // 조용한 영역(quiet zone) 보정
      hist.pop();
      hist.unshift(runLen);
    };
    const countPatterns = (h) => {
      const n = h[1];
      const core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n;
      return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0)
        + (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0);
    };
    const terminateAndCount = (color, runLen, hist) => {
      if (color) { addHistory(runLen, hist); runLen = 0; }
      runLen += size;
      addHistory(runLen, hist);
      return countPatterns(hist);
    };

    function penalty() {
      let result = 0;
      const N1 = 3, N2 = 3, N3 = 40, N4 = 10;

      for (let y = 0; y < size; y++) {
        let color = 0, run = 0;
        const hist = [0, 0, 0, 0, 0, 0, 0];
        for (let x = 0; x < size; x++) {
          if (modules[y][x] === color) {
            run++;
            if (run === 5) result += N1;
            else if (run > 5) result++;
          } else {
            addHistory(run, hist);
            if (!color) result += countPatterns(hist) * N3;
            color = modules[y][x];
            run = 1;
          }
        }
        result += terminateAndCount(color, run, hist) * N3;
      }
      for (let x = 0; x < size; x++) {
        let color = 0, run = 0;
        const hist = [0, 0, 0, 0, 0, 0, 0];
        for (let y = 0; y < size; y++) {
          if (modules[y][x] === color) {
            run++;
            if (run === 5) result += N1;
            else if (run > 5) result++;
          } else {
            addHistory(run, hist);
            if (!color) result += countPatterns(hist) * N3;
            color = modules[y][x];
            run = 1;
          }
        }
        result += terminateAndCount(color, run, hist) * N3;
      }
      for (let y = 0; y < size - 1; y++) {
        for (let x = 0; x < size - 1; x++) {
          const c = modules[y][x];
          if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) {
            result += N2;
          }
        }
      }
      let dark = 0;
      for (const row of modules) for (const v of row) dark += v;
      const total = size * size;
      const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
      return result + k * N4;
    }

    let bestMask = 0, bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      applyMask(mask);
      drawFormatBits(mask);
      const score = penalty();
      if (score < bestScore) { bestScore = score; bestMask = mask; }
      applyMask(mask);   // 되돌리기 (XOR)
    }
    applyMask(bestMask);
    drawFormatBits(bestMask);

    return { size, modules, version: ver, mask: bestMask, ecl: eclName };
  }

  return { createMatrix };
})();

/* =========================================================================
   앱
   ========================================================================= */
const canvas = document.getElementById("qr");
const ctx = canvas.getContext("2d");
const uuidText = document.getElementById("uuidText");
const metaText = document.getElementById("meta");
const eclSelect = document.getElementById("ecl");
const upperToggle = document.getElementById("upper");
const toast = document.getElementById("toast");

const QUIET = 4;   // 조용한 영역 (모듈 단위)
let currentUuid = "";

function uuidv4() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;   // version 4
  b[8] = (b[8] & 0x3f) | 0x80;   // variant 10
  const hex = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
}

function drawQr(text, eclName) {
  const qr = QR.createMatrix(text, eclName);
  const total = qr.size + QUIET * 2;

  // 화면 픽셀 밀도에 맞춰 모듈당 정수 픽셀을 배정 → 흐릿함/모아레 방지
  const frameWidth = canvas.parentElement.clientWidth || 320;
  const cssWidth = Math.min(Math.max(frameWidth - 24, 160), 320);
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.max(2, Math.floor((cssWidth * dpr) / total));
  const px = total * scale;

  canvas.width = px;
  canvas.height = px;
  canvas.style.aspectRatio = "1 / 1";

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = "#000000";
  for (let y = 0; y < qr.size; y++) {
    for (let x = 0; x < qr.size; x++) {
      if (qr.modules[y][x]) {
        ctx.fillRect((x + QUIET) * scale, (y + QUIET) * scale, scale, scale);
      }
    }
  }
  return qr;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1600);
}

function render(newUuid = true) {
  if (newUuid || !currentUuid) currentUuid = uuidv4();
  const shown = upperToggle.checked ? currentUuid.toUpperCase() : currentUuid;
  const qr = drawQr(shown, eclSelect.value);
  uuidText.textContent = shown;
  canvas.setAttribute("aria-label", `UUID ${shown} QR 코드`);
  metaText.textContent = `버전 ${qr.version} · ${qr.size}×${qr.size} · 오류정정 ${qr.ecl} · 마스크 ${qr.mask}`;
}

async function copyUuid() {
  const shown = uuidText.textContent;
  try {
    await navigator.clipboard.writeText(shown);
    showToast("복사했습니다");
  } catch {
    // 비보안 컨텍스트(http, file://) 대비 폴백
    const ta = document.createElement("textarea");
    ta.value = shown;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    showToast(ok ? "복사했습니다" : "복사에 실패했습니다");
  }
}

function savePng() {
  canvas.toBlob((blob) => {
    if (!blob) { showToast("저장에 실패했습니다"); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `uuid-${currentUuid}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("PNG를 저장했습니다");
  }, "image/png");
}

document.getElementById("regen").addEventListener("click", () => render(true));
document.getElementById("copy").addEventListener("click", copyUuid);
document.getElementById("save").addEventListener("click", savePng);
eclSelect.addEventListener("change", () => render(false));
upperToggle.addEventListener("change", () => render(false));

// 화면 회전 / 리사이즈 시 해상도 재계산
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(false), 150);
});

// 스페이스바 / 엔터로 재생성 (데스크톱 편의)
document.addEventListener("keydown", (e) => {
  if (e.target.matches("button, select, input")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); render(true); }
});

render(true);
</script>
</body>
</html>
